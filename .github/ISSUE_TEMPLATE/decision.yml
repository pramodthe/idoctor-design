name: Decision
description: A product or science call the team needs to freeze. Lives on the coordination dashboard.
title: "[decision] "
labels: ["decision"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      placeholder: Do we keep PDB 6OIM as the default KRAS G12C pocket?
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      placeholder: |
        A) Keep 6OIM
        B) Switch if Paperclip finds a better structure
    validations:
      required: true
  - type: textarea
    id: freeze
    attributes:
      label: Freeze by
      description: After this time, pick a default and close the issue.
      placeholder: Sat 10:30 — mutations frozen
    validations:
      required: false
